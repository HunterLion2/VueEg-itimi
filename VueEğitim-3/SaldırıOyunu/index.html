<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3.4.9/dist/vue.global.js" defer></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Saldırı Oyunu</title>
  </head>
  <style>
    h1 {
      margin-top: 10px;
      text-align: center;
    }

    .computer {
      padding: 20px;
      margin-top: 10px;
      border-radius: 15px;
      border: 2px solid #ccc;
      text-align: center;
      align-items: center;
    }

    .computer-circle {
        border: 1px solid #ffbe33;
        background-color: #e99f00;
        width: 100%;
        height: 20px;
        border-radius: 10px;
    }

    .me {
      padding: 20px;
      margin-top: 10px;
      border-radius: 15px;
      border: 2px solid #ccc;
      text-align: center;
      align-items: center;
    }

    .me-circle {
        border: 1px solid #ffbe33;
        background-color: #e99f00;
        width: 100%;
        height: 20px;
        border-radius: 10px;
    }

    .button-group {
        text-align: center;
        align-items: center;
    }

  </style>
  <body>
    <header class="container">
      <h1>Saldırı Oyunu</h1>
    </header>

    <section id="frontend">
      <div class="container">
        <div class="row">
          <div class="col-lg-6">
            <div class="computer">
              <h2>Bilgisayar</h2>
              <div class="computer-circle" :style="{ width: computerhealty + '%' }"></div>
              <h5 class="average mt-2">%{{computerhealty}}</h5>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="me">
              <h2>Ben</h2>
              <div class="me-circle" :style="{ width: mehealty + '%' }"></div>
              <h5 class="average mt-2">%{{mehealty}}</h5>
            </div>
          </div>
        </div>
        <div class="button-group mt-3">
            <button class="btn btn-primary mx-2" @click="attack()">Saldır</button>
            <button class="btn btn-secondary mx-2" v-if="total == 4 " @click="superattack()">Süper Saldırı</button>
            <button class="btn btn-danger mx-2" @click="healty()">Can Ver</button>
        </div>
      </div>


    </section>

    <script src="script.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
